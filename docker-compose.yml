services:
  web:
    build: ./Fitness-booking-system 
    command: python3 manage.py runserver 127.0.0.1:8000
    volumes:
      - ./Fitness-booking-system :/Fitness-booking-system 
    ports:
     - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres
    container_name: fitness_postgres
    restart: always
    environment:
      POSTGRES_DB: fitness_db
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: fitness_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
