services:
  db:
    image: postgres
    container_name: fitness_postgres
    restart: always
    environment:
      POSTGRES_DB: fitness_db
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: fitness_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  web:
    build: .
    container_name: fitness_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
